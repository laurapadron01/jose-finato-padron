<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · José Finato Padrón</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f2eadc;--char:#1d1c1a;--orange:#c4561e;--oak:#b08560;--muted:#a89c8f}
  *{margin:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#141210;color:var(--cream);font-family:"Hanken Grotesk",system-ui,sans-serif;text-align:center;padding:24px}
  .box{max-width:520px}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-weight:600;font-size:clamp(72px,18vw,140px);line-height:.9;letter-spacing:-.04em;margin:14px 0}
  h1 span{color:var(--oak)}
  p{color:var(--muted);font-size:17px;line-height:1.5;margin-bottom:28px}
  a.btn{display:inline-flex;align-items:center;gap:10px;background:var(--orange);color:#fff;
    padding:14px 22px;border-radius:999px;font-weight:500;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <span class="eyebrow">Error 404</span>
    <h1>No <span>existe</span></h1>
    <p>La página que buscas no está aquí. Puede que el enlace haya cambiado o ya no exista.</p>
    <a class="btn" href="/">Volver al inicio ↗</a>
  </div>
</body>
</html>
